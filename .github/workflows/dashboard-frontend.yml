name: DashBoard-Frontend CI/CD

on:
  push:
    branches:
      - master
    paths:
      - 'frontend/Dasboard-Frontend/**'
      - '.github/workflows/dashboard-frontend.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: DockerHub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            --build-arg VITE_RAZORPAY_KEY_ID="${{ secrets.VITE_RAZORPAY_KEY_ID }}" \
            -t ${{ secrets.DOCKER_USERNAME }}/deployhub-dashboard-frontend:latest \
            ./frontend/Dasboard-Frontend

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/deployhub-dashboard-frontend:latest
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Push image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/deployhub-dashboard-frontend:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_ACCESS_TOKEN: ${{ secrets.DOCKER_ACCESS_TOKEN }}

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: DOCKER_USERNAME,DOCKER_ACCESS_TOKEN

          script: |
            echo "$DOCKER_ACCESS_TOKEN" | docker login -u "$DOCKER_USERNAME" --password-stdin

            docker pull "$DOCKER_USERNAME/deployhub-dashboard-frontend:latest"

            docker stop appdeployhub  || true
            docker rm appdeployhub  || true

            docker run -d \
              --name appdeployhub  \
              --network cloud \
              --restart always \
              "$DOCKER_USERNAME/deployhub-dashboard-frontend:latest"

            docker image prune -af

            docker logout