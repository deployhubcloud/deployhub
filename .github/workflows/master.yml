name: CI/CD — platformrouter

on:
  push:
    branches:
      - master
    paths:
      - 'routers/platform-router/**'
      - '.github/workflows/master.yml'

env:
  IMAGE: ${{ secrets.DOCKER_USERNAME }}/platformrouter:latest
  CONTAINER: platformrouter

jobs:
  # ---- Build & Push ----
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: routers/platform-router
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=registry,ref=${{ env.IMAGE }}-cache
          cache-to: type=registry,ref=${{ env.IMAGE }}-cache,mode=max

  # ---- Deploy ----
  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_ACCESS_TOKEN }}
            docker pull ${{ secrets.DOCKER_USERNAME }}/platformrouter:latest

            docker stop platformrouter || true
            docker rm platformrouter || true

            docker run -d \
              --name platformrouter \
              --restart always \
              -p 127.0.0.1:${{ secrets.PLATFORM_ROUTER_PORT }}:${{ secrets.PLATFORM_ROUTER_PORT }} \
              -e PLATFORM_ROUTER_PORT=${{ secrets.PLATFORM_ROUTER_PORT }} \
              -e PROXY_TIMEOUT_MS=${{ secrets.PROXY_TIMEOUT_MS }} \
              -e HTTP_MAX_SOCKETS=${{ secrets.HTTP_MAX_SOCKETS }} \
              --add-host host.docker.internal:host-gateway \
              --network cloud \
              --network proxy-net \
              ${{ secrets.DOCKER_USERNAME }}/platformrouter:latest