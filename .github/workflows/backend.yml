name: Backend Services CI/CD 

on:
  push:
    branches:
      - master
    paths:  
      - 'backend/services/**'
      - 'backend/api-gateway/**'
      - 'backend/shared/**'
      - 'backend/Dockerfile'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: apigateway
            image: deployhubapigateway
            context: ./backend
            dockerfile: ./backend/Dockerfile
            build_args: SERVICE_PATH=api-gateway
          - name: identityservice
            image: deployhubidentityservice
            context: ./backend
            dockerfile: ./backend/Dockerfile
            build_args: SERVICE_PATH=services/identity-service
          - name: projectservice
            image: deployhubprojectservice
            context: ./backend
            dockerfile: ./backend/Dockerfile
            build_args: SERVICE_PATH=services/project-service
          - name: buildservice
            image: deployhubbuildservice
            context: ./backend
            dockerfile: ./backend/Dockerfile
            build_args: SERVICE_PATH=services/build-service
          - name: deployservice
            image: deployhubdeployservice
            context: ./backend
            dockerfile: ./backend/Dockerfile
            build_args: SERVICE_PATH=services/deploy-service
          - name: notificationservice
            image: deployhubnotificationservice
            context: ./backend
            dockerfile: ./backend/Dockerfile
            build_args: SERVICE_PATH=services/notification-service
          - name: streamservice
            image: deployhubstreamservice
            context: ./backend
            dockerfile: ./backend/Dockerfile
            build_args: SERVICE_PATH=services/stream-service
          - name: secretsmanager
            image: deployhubsecretsmanager
            context: ./backend
            dockerfile: ./backend/Dockerfile
            build_args: 'SERVICE_PATH=services/secrets-manager'
          - name: analyticsservice
            image: deployhubanalyticsservice
            context: ./backend
            dockerfile: ./backend/Dockerfile
            build_args: 'SERVICE_PATH=services/analytics-service'
          - name: adminservice
            image: deployhubadminservice
            context: ./backend
            dockerfile: ./backend/Dockerfile
            build_args: 'SERVICE_PATH=services/admin-service'
          - name: agentservice
            image: deployhubagentservice
            context: ./backend
            dockerfile: ./backend/Dockerfile
            build_args: 'SERVICE_PATH=services/agent-service'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: DockerHub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Build Docker image
        run: |
          BUILD_ARG=""
          if [ -n "${{ matrix.build_args }}" ]; then
            BUILD_ARG="--build-arg ${{ matrix.build_args }}"
          fi
          docker build $BUILD_ARG \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:latest \
            -f ${{ matrix.dockerfile }} \
            ${{ matrix.context }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:latest
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Push image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy all services via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          NODE_ENV: ${{secrets.NODE_ENV}}
          DOCKER_ACCESS_TOKEN: ${{ secrets.DOCKER_ACCESS_TOKEN }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          BOOTSTRAP_TOKEN: ${{ secrets.BOOTSTRAP_TOKEN }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
          REFRESH_TOKEN_SECRET: ${{ secrets.REFRESH_TOKEN_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.CLIENT_ID_GITHUB }}
          GITHUB_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET_GITHUB }}
          GITHUB_TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY_GITHUB }}
          GITHUB_WEBHOOK_SECRET:  ${{ secrets.WEBHOOK_SECRET_GITHUB }}
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
          INTERNAL_SERVICE_TALKING_SECRET: ${{ secrets.INTERNAL_SERVICE_TALKING_SECRET }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          IDENTITY_SERVICE_MONGODB_URI: ${{ secrets.IDENTITY_SERVICE_MONGODB_URI }}
          BUILD_SERVICE_MONGODB_URI: ${{ secrets.BUILD_SERVICE_MONGODB_URI }}
          DEPLOY_SERVICE_MONGODB_URI: ${{ secrets.DEPLOY_SERVICE_MONGODB_URI }}
          PROJECT_SERVICE_MONGODB_URI: ${{ secrets.PROJECT_SERVICE_MONGODB_URI }}
          MONITORING_MONGODB_URI: ${{ secrets.MONITORING_MONGODB_URI }}
          NOTIFICATION_MONGODB_URI: ${{ secrets.NOTIFICATION_MONGODB_URI }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          DEVLOAD_API_KEY: ${{ secrets.DEVLOAD_API_KEY }}
          DEVLOAD_PROJECT_ID: ${{ secrets.DEVLOAD_PROJECT_ID }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          RABBITMQ_URL: ${{ secrets.RABBITMQ_URL }}
          IDENTITY_SERVICE_URL: ${{ secrets.IDENTITY_SERVICE_URL }}
          PROJECT_SERVICE_URL: ${{ secrets.PROJECT_SERVICE_URL }}
          MONITORING_SERVICE_URL: ${{ secrets.MONITORING_SERVICE_URL }}
          ANALYTICS_SERVICE_URL: ${{ secrets.ANALYTICS_SERVICE_URL }}
          BUILD_SERVICE_URL: ${{ secrets.BUILD_SERVICE_URL }}
          DEPLOY_SERVICE_URL: ${{ secrets.DEPLOY_SERVICE_URL }}
          MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_PUBLIC_HOST: ${{ secrets.MINIO_PUBLIC_HOST }}
          SECRETS_MANAGER_URL: ${{ secrets.SECRETS_MANAGER_URL }}
          BUILD_SERVICE_NAME: ${{ secrets.BUILD_SERVICE_NAME }}
          DEPLOY_SERVICE_NAME: ${{ secrets.DEPLOY_SERVICE_NAME }}
          IDENTITY_SERVICE_NAME: ${{ secrets.IDENTITY_SERVICE_NAME }}
          NOTIFICATION_SERVICE_NAME: ${{ secrets.NOTIFICATION_SERVICE_NAME }}
          PROJECT_SERVICE_NAME: ${{ secrets.PROJECT_SERVICE_NAME }}
          APIGATEWAY_SERVICE_NAME: ${{ secrets.APIGATEWAY_SERVICE_NAME }}
          STREAM_SERVICE_NAME: ${{ secrets.STREAM_SERVICE_NAME }}
          ANALYTICS_SERVICE_NAME: ${{ secrets.ANALYTICS_SERVICE_NAME }}
          ADMIN_SERVICE_PORT: ${{ secrets.ADMIN_SERVICE_PORT }}
          ADMIN_SERVICE_URL: ${{ secrets.ADMIN_SERVICE_URL }}
          ADMIN_FRONTEND_URL: ${{ secrets.ADMIN_FRONTEND_URL }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
          ADMIN_SERVICE_NAME: ${{ secrets.ADMIN_SERVICE_NAME }}
          AGENT_SERVICE_NAME: ${{ secrets.AGENT_SERVICE_NAME }}
          AGENT_SERVICE_PORT: ${{ secrets.AGENT_SERVICE_PORT }}
          AGENT_SERVICE_URL: ${{ secrets.AGENT_SERVICE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: ANALYTICS_SERVICE_NAME,SERVER_IP,CERTBOT_EMAIL,DOCKER_USERNAME,FRONTEND_URL,DOCKER_ACCESS_TOKEN,DOCKER_PASSWORD,REDIS_HOST,REDIS_PASSWORD,REDIS_URL,BOOTSTRAP_TOKEN,ACCESS_TOKEN_SECRET,REFRESH_TOKEN_SECRET,GITHUB_CLIENT_ID,GITHUB_CLIENT_SECRET,GITHUB_TOKEN_ENCRYPTION_KEY,GITHUB_WEBHOOK_SECRET,INTERNAL_SECRET,INTERNAL_SERVICE_TALKING_SECRET,EMAIL_USER,EMAIL_PASS,IDENTITY_SERVICE_MONGODB_URI,BUILD_SERVICE_MONGODB_URI,DEPLOY_SERVICE_MONGODB_URI,PROJECT_SERVICE_MONGODB_URI,MONITORING_MONGODB_URI,NOTIFICATION_MONGODB_URI,RAZORPAY_KEY_ID,RAZORPAY_KEY_SECRET,DEVLOAD_API_KEY,DEVLOAD_PROJECT_ID,FRONTEND_URL,RABBITMQ_URL,IDENTITY_SERVICE_URL,PROJECT_SERVICE_URL,MONITORING_SERVICE_URL,BUILD_SERVICE_URL,DEPLOY_SERVICE_URL,MINIO_BUCKET,MINIO_SECRET_KEY,MINIO_ACCESS_KEY,MINIO_PUBLIC_HOST,SECRETS_MANAGER_URL,BUILD_SERVICE_NAME,DEPLOY_SERVICE_NAME,IDENTITY_SERVICE_NAME,NOTIFICATION_SERVICE_NAME,APIGATEWAY_SERVICE_NAME,PROJECT_SERVICE_NAME,NODE_ENV,ANALYTICS_SERVICE_URL,STREAM_SERVICE_NAME,ADMIN_SERVICE_PORT,ADMIN_SERVICE_URL,ADMIN_FRONTEND_URL,ADMIN_ID,ADMIN_PASSWORD,ADMIN_EMAIL,ADMIN_SESSION_SECRET,ADMIN_SERVICE_NAME,AGENT_SERVICE_NAME,AGENT_SERVICE_PORT,AGENT_SERVICE_URL,GROQ_API_KEY,GROQ_API_KEYS,GROQ_MODEL
          script: |
            echo "$DOCKER_ACCESS_TOKEN" | docker login -u "$DOCKER_USERNAME" --password-stdin

            SERVICES="api-gateway identity-service project-service build-service deploy-service notification-service stream-service secrets-manager analytics-service admin-service agent-service"

            for svc in $SERVICES; do
              case $svc in
                api-gateway) IMAGE=deployhubapigateway; PORT_MAP="-p 127.0.0.1:4999:4999" ;;
                identity-service) IMAGE=deployhubidentityservice; PORT_MAP="-p 127.0.0.1:4001:4001" ;;
                project-service) IMAGE=deployhubprojectservice; PORT_MAP="-p 127.0.0.1:4002:4002" ;;
                build-service) IMAGE=deployhubbuildservice; PORT_MAP="-p 127.0.0.1:4003:4003" ;;
                deploy-service) IMAGE=deployhubdeployservice; PORT_MAP="-p 127.0.0.1:4004:4004" ;;
                notification-service) IMAGE=deployhubnotificationservice; PORT_MAP="-p 127.0.0.1:4006:4006" ;;
                stream-service) IMAGE=deployhubstreamservice; PORT_MAP="-p 127.0.0.1:4008:4008" ;;
                secrets-manager) IMAGE=deployhubsecretsmanager; PORT_MAP="-p 127.0.0.1:4000:4000" ;;
                analytics-service) IMAGE=deployhubanalyticsservice; PORT_MAP="-p 127.0.0.1:4009:4009" ;;
                admin-service) IMAGE=deployhubadminservice; PORT_MAP="-p 127.0.0.1:4010:4010" ;;
                agent-service) IMAGE=deployhubagentservice; PORT_MAP="-p 127.0.0.1:4011:4011" ;;
              esac

              case $svc in
                secrets-manager)
                  ENV_ARGS="-e GITHUB_WEBHOOK_SECRET=$GITHUB_WEBHOOK_SECRET -e REDIS_HOST=$REDIS_HOST -e ANALYTICS_SERVICE_URL=$ANALYTICS_SERVICE_URL -e REDIS_PASSWORD=$REDIS_PASSWORD -e REDIS_URL=$REDIS_URL -e BOOTSTRAP_TOKEN=$BOOTSTRAP_TOKEN -e ACCESS_TOKEN_SECRET=$ACCESS_TOKEN_SECRET -e REFRESH_TOKEN_SECRET=$REFRESH_TOKEN_SECRET -e GITHUB_CLIENT_ID=$GITHUB_CLIENT_ID -e GITHUB_CLIENT_SECRET=$GITHUB_CLIENT_SECRET -e GITHUB_TOKEN_ENCRYPTION_KEY=$GITHUB_TOKEN_ENCRYPTION_KEY -e INTERNAL_SECRET=$INTERNAL_SECRET -e INTERNAL_SERVICE_TALKING_SECRET=$INTERNAL_SERVICE_TALKING_SECRET -e EMAIL_USER=$EMAIL_USER -e EMAIL_PASS=$EMAIL_PASS -e IDENTITY_SERVICE_MONGODB_URI=$IDENTITY_SERVICE_MONGODB_URI -e NOTIFICATION_MONGODB_URI=$NOTIFICATION_MONGODB_URI -e DOCKER_USERNAME=$DOCKER_USERNAME -e DOCKER_PASSWORD=$DOCKER_PASSWORD -e BUILD_SERVICE_MONGODB_URI=$BUILD_SERVICE_MONGODB_URI -e DEPLOY_SERVICE_MONGODB_URI=$DEPLOY_SERVICE_MONGODB_URI -e PROJECT_SERVICE_MONGODB_URI=$PROJECT_SERVICE_MONGODB_URI -e MONITORING_MONGODB_URI=$MONITORING_MONGODB_URI -e RAZORPAY_KEY_ID=$RAZORPAY_KEY_ID -e RAZORPAY_KEY_SECRET=$RAZORPAY_KEY_SECRET -e DEVLOAD_API_KEY=$DEVLOAD_API_KEY -e DEVLOAD_PROJECT_ID=$DEVLOAD_PROJECT_ID -e FRONTEND_URL=$FRONTEND_URL -e RABBITMQ_URL=$RABBITMQ_URL -e IDENTITY_SERVICE_URL=$IDENTITY_SERVICE_URL -e PROJECT_SERVICE_URL=$PROJECT_SERVICE_URL -e MONITORING_SERVICE_URL=$MONITORING_SERVICE_URL -e BUILD_SERVICE_URL=$BUILD_SERVICE_URL -e DEPLOY_SERVICE_URL=$DEPLOY_SERVICE_URL -e MINIO_BUCKET=$MINIO_BUCKET -e MINIO_SECRET_KEY=$MINIO_SECRET_KEY -e MINIO_ACCESS_KEY=$MINIO_ACCESS_KEY -e MINIO_PUBLIC_HOST=$MINIO_PUBLIC_HOST -e NODE_ENV=$NODE_ENV -e ADMIN_ID=$ADMIN_ID -e ADMIN_PASSWORD=$ADMIN_PASSWORD -e ADMIN_EMAIL=$ADMIN_EMAIL -e ADMIN_SESSION_SECRET=$ADMIN_SESSION_SECRET -e ADMIN_SERVICE_URL=$ADMIN_SERVICE_URL -e ADMIN_FRONTEND_URL=$ADMIN_FRONTEND_URL -e GROQ_MODEL=$GROQ_MODEL -e GROQ_API_KEY=$GROQ_API_KEY -e GROQ_API_KEYS=$GROQ_API_KEYS -e AGENT_SERVICE_URL=$AGENT_SERVICE_URL -e AGENT_SERVICE_PORT=$AGENT_SERVICE_PORT -e AGENT_SERVICE_NAME=$AGENT_SERVICE_NAME"
                  ;;
                build-service)
                  ENV_ARGS="-e BUILD_SERVICE_NAME=$BUILD_SERVICE_NAME -e BOOTSTRAP_TOKEN=$BOOTSTRAP_TOKEN -e SECRETS_MANAGER_URL=$SECRETS_MANAGER_URL"
                  ;;
                deploy-service)
                  ENV_ARGS="-e DEPLOY_SERVICE_NAME=$DEPLOY_SERVICE_NAME -e BOOTSTRAP_TOKEN=$BOOTSTRAP_TOKEN -e SECRETS_MANAGER_URL=$SECRETS_MANAGER_URL"
                  ;;
                identity-service)
                  ENV_ARGS="-e IDENTITY_SERVICE_NAME=$IDENTITY_SERVICE_NAME -e BOOTSTRAP_TOKEN=$BOOTSTRAP_TOKEN -e SECRETS_MANAGER_URL=$SECRETS_MANAGER_URL"
                  ;;
                notification-service)
                  ENV_ARGS="-e NOTIFICATION_SERVICE_NAME=$NOTIFICATION_SERVICE_NAME -e BOOTSTRAP_TOKEN=$BOOTSTRAP_TOKEN -e SECRETS_MANAGER_URL=$SECRETS_MANAGER_URL"
                  ;;
                project-service)
                  ENV_ARGS="-e SERVER_IP=$SERVER_IP -e CERTBOT_EMAIL=$CERTBOT_EMAIL -e PROJECT_SERVICE_NAME=$PROJECT_SERVICE_NAME -e BOOTSTRAP_TOKEN=$BOOTSTRAP_TOKEN -e SECRETS_MANAGER_URL=$SECRETS_MANAGER_URL"
                  ;;
                stream-service)
                  ENV_ARGS="-e STREAM_SERVICE_NAME=$STREAM_SERVICE_NAME -e BOOTSTRAP_TOKEN=$BOOTSTRAP_TOKEN -e SECRETS_MANAGER_URL=$SECRETS_MANAGER_URL"
                  ;;
                api-gateway)
                  ENV_ARGS="-e APIGATEWAY_SERVICE_NAME=$APIGATEWAY_SERVICE_NAME -e BOOTSTRAP_TOKEN=$BOOTSTRAP_TOKEN -e SECRETS_MANAGER_URL=$SECRETS_MANAGER_URL"
                  ;;
                analytics-service)
                  ENV_ARGS="-e ANALYTICS_SERVICE_NAME=$ANALYTICS_SERVICE_NAME -e BOOTSTRAP_TOKEN=$BOOTSTRAP_TOKEN -e SECRETS_MANAGER_URL=$SECRETS_MANAGER_URL"
                  ;;
                admin-service)
                  ENV_ARGS="-e ADMIN_SERVICE_NAME=$ADMIN_SERVICE_NAME -e BOOTSTRAP_TOKEN=$BOOTSTRAP_TOKEN -e SECRETS_MANAGER_URL=$SECRETS_MANAGER_URL"
                  ;;
                agent-service)
                  ENV_ARGS="-e AGENT_SERVICE_NAME=$AGENT_SERVICE_NAME -e BOOTSTRAP_TOKEN=$BOOTSTRAP_TOKEN -e SECRETS_MANAGER_URL=$SECRETS_MANAGER_URL"
                  ;;
              esac

              # Volume mounts per service
              VOLUME_ARGS=""
              case $svc in
                build-service|deploy-service|project-service|stream-service|agent-service)
                  VOLUME_ARGS="-v /var/run/docker.sock:/var/run/docker.sock"
                  ;;
              esac
              case $svc in
                project-service)
                  VOLUME_ARGS="$VOLUME_ARGS -v /home/rahul/docker/letsencrypt:/etc/letsencrypt"
                  ;;
              esac

              docker pull "$DOCKER_USERNAME/$IMAGE:latest"
              docker stop "$IMAGE" || true
              docker rm "$IMAGE" || true

              docker run -d --name "$IMAGE" \
                $PORT_MAP \
                --network cloud \
                $ENV_ARGS \
                $VOLUME_ARGS \
                --restart always \
                "$DOCKER_USERNAME/$IMAGE:latest"
            done

            docker image prune -af
            docker logout