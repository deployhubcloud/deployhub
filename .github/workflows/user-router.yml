name: CI/CD — user-router

on:
  push:
    branches:
      - master
    paths:
      - 'routers/user-router/**'
      - '.github/workflows/user-router.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            if [ ! -d "$HOME/deployhub" ]; then
              git clone https://${{ secrets.GH_PAT }}@github.com/deployhubcloud/deployhub.git $HOME/deployhub
            fi

            cd $HOME/deployhub
            git pull https://${{ secrets.GH_PAT }}@github.com/deployhubcloud/deployhub.git master

            cd routers/user-router

            npm install

            pm2 stop user-router || true
            pm2 delete user-router || true

            pm2 start index.js --name user-router

            pm2 save