name: CI/CD — user-router

on:
  push:
    branches:
      - master
    paths:
      - 'routers/user-router/**'
      - '.github/workflows/user-router.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/deployhub/routers/user-router

            git pull origin master

            cd routers/user-router

            npm ci

            npx pm2 stop user-router || true
            npx pm2 delete user-router || true

            npx pm2 start index.js --name user-router

            npx pm2 save